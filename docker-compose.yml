version: '3.8'

services:
  web:
    build: .
    container_name: vulneflab_web
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      
    depends_on:
      - db

  db:
    image: mysql:5.7
    container_name: vulneflab_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: vulneflab_db
    volumes:
      - ./db:/docker-entrypoint-initdb.d
